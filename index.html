<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Momentum – persönlicher Planer für Gewohnheiten, Routinen und Ziele. Funktioniert offline." />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Momentum</title>
    <script>
      // …/momentum (without slash) -> …/momentum/ so relative asset paths resolve
      ;(function () {
        var p = location.pathname
        if (p.length > 1 && p.slice(-1) !== '/' && p.split('/').pop().indexOf('.') < 0) location.replace(p + '/' + location.search + location.hash)
      })()
    </script>
    <script>
      // Apply theme before first paint to avoid a flash.
      ;(function () {
        try {
          var p = JSON.parse(localStorage.getItem('momentum.prefs.v1') || '{}')
          var t = p.theme || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (p.lang) document.documentElement.lang = p.lang
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Momentum benötigt JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
